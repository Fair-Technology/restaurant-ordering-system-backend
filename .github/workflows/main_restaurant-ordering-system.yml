# Builds one artifact per commit, tests it and deploys it to the dev Function App.
# Production is never built here: promote.yml ships this same artifact.
#
#   push to main -> npm ci, build, test -> artifact -> deploy to restaurant-ordering-system-dev
#
# To go live:  git tag v0.1.0 && git push origin v0.1.0

name: Build, test and deploy (dev)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'
  ARTIFACT_NAME: app-${{ github.sha }}

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies exactly as pinned in package-lock.json
        run: npm ci

      - name: Build (TypeScript compile)
        run: npm run build

      - name: Test (vitest)
        run: npm test

      - name: Drop dev dependencies from the package
        if: github.event_name == 'push'
        run: npm prune --omit=dev

      - name: Zip artifact for deployment
        if: github.event_name == 'push'
        run: zip -r release.zip . -x '.git/*' '.github/*' 'release.zip'

      - name: Upload artifact for deployment job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release.zip
          retention-days: 90

  deploy_dev:
    name: Deploy to dev
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No `environment:` here on purpose: an environment-based OIDC subject
    # (...:environment:dev) does not match this app's federated identity credential,
    # which is registered for the branch subject (...:ref:refs/heads/dev).
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Unzip artifact for deployment
        run: |
          unzip -o release.zip -d ./app
          rm release.zip

      - name: Sanity check the artifact
        run: |
          test -f app/host.json
          test -f app/dist/index.js

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'restaurant-ordering-system-dev'
          slot-name: 'Production'
          package: './app'
